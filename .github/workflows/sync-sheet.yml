# =====================================================
# Googleスプレッドシートの内容を自動でサイトへ反映します。
#
#   ・30分おきに、スプレッドシートに変更がないか確認します
#   ・変更があれば data/properties.csv と data/properties.js を更新して
#     コミットします
#   ・入力に問題があれば何も変更せず、このワークフローが失敗として残ります
#     （Actions のログにどの行の何が悪いか日本語で出ます）
#
# 使うための準備:
#   1. tools/sheet-url.txt にスプレッドシートのURLを書く
#   2. スプレッドシートの共有を「リンクを知っている全員」→「閲覧者」にする
#   3. GitHub の Settings → Actions → General →
#      Workflow permissions を「Read and write permissions」にする
#
# 自動反映を止めたいときは、下の schedule: の3行を # でコメントアウトして
# ください（手動実行だけ残ります）。
# =====================================================
name: スプレッドシートを反映

on:
  schedule:
    # UTC基準。*/30 は30分おき
    - cron: '*/30 * * * *'
  workflow_dispatch: # Actionsタブから手動でも実行できます

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: スプレッドシートを取り込んで反映
        run: node tools/fetch-sheet.js

      - name: 変更があればコミットする
        run: |
          # 物件を追加すると sitemap.xml も変わり、大きい写真は自動縮小されるため、
          # 生成・更新されうるものをまとめて対象にする
          TARGETS="data/ sitemap.xml robots.txt images/properties/"
          if git diff --quiet -- $TARGETS; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TARGETS
          git commit -m "物件情報を更新（スプレッドシートから自動反映）"
          git push
          echo "反映した内容:"
          git show --stat --oneline HEAD

      - name: 取り残した変更がないか確認する
        run: |
          # 生成物のコミット漏れがあると、次のテストで「最新ではない」と落ちるため
          if ! git diff --quiet; then
            echo "::error::コミットされていない変更が残っています。"
            git status --short
            exit 1
          fi
