# =====================================================
# Googleスプレッドシートの内容を自動でサイトへ反映します。
#
#   ・毎朝8時（日本時間）に、スプレッドシートに変更がないか確認します
#   ・写真が images/properties/ に追加・削除されたときは、その場で反映します
#   ・変更があれば data/properties.csv と data/properties.js を更新して
#     コミットします
#   ・入力に問題があれば何も変更せず、このワークフローが失敗として残ります
#     （Actions のログにどの行の何が悪いか日本語で出ます）
#
# 使うための準備:
#   1. tools/sheet-url.txt にスプレッドシートのURLを書く
#   2. スプレッドシートの共有を「リンクを知っている全員」→「閲覧者」にする
#   3. GitHub の Settings → Actions → General →
#      Workflow permissions を「Read and write permissions」にする
#
# 頻度を変えたいときは cron の値を書き換えてください。
#   毎朝8時（日本時間）  0 23 * * *   ← 現在の設定
#   平日の朝8時だけ      0 23 * * 0-4
#   1時間おき            0 * * * *
# 自動反映を止めたいときは schedule: の3行を # でコメントアウトしてください
# （手動実行だけ残ります）。
# =====================================================
name: スプレッドシートを反映

on:
  schedule:
    # UTC基準のため、日本時間の朝8時は前日の23時にあたる
    - cron: '0 23 * * *'
  push:
    # GitHubの画面から写真をアップロード／削除したら、待たずに反映する。
    # （この工程自身のコミットは GITHUB_TOKEN で行われるため、繰り返しにはなりません）
    branches: [main]
    paths: ['images/properties/**']
  workflow_dispatch: # 急ぎのときはActionsタブから手動で実行できます

concurrency:
  group: sync-sheet
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 写真だけを反映（写真のアップロードで動いたとき）
        if: github.event_name == 'push'
        # スプレッドシートは見に行かない。写真を上げただけなのに
        # シート側の一時的な不調で失敗する、という事故を防ぐため。
        run: node tools/csv-to-properties.js

      - name: スプレッドシートと写真を取り込んで反映
        if: github.event_name != 'push'
        env:
          # 写真をGoogleドライブから取り込む場合に設定します。
          # 未設定でもスプレッドシートの反映は動きます（写真は images/properties/ のまま）。
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/fetch-sheet.js

      - name: 変更があればコミットする
        run: |
          # 物件を追加すると sitemap.xml も変わり、大きい写真は自動縮小されるため、
          # 生成・更新されうるものをまとめて対象にする
          TARGETS="data/ sitemap.xml robots.txt images/properties/"
          if git diff --quiet -- $TARGETS; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TARGETS
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG="物件写真を反映（自動）"
          else
            MSG="物件情報を更新（スプレッドシートから自動反映）"
          fi
          git commit -m "$MSG"
          git push
          echo "反映した内容:"
          git show --stat --oneline HEAD

      - name: 取り残した変更がないか確認する
        run: |
          # 生成物のコミット漏れがあると、次のテストで「最新ではない」と落ちるため
          if ! git diff --quiet; then
            echo "::error::コミットされていない変更が残っています。"
            git status --short
            exit 1
          fi
