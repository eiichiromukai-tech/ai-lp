# =====================================================
# 【移行前の予備】Googleスプレッドシートの内容をサイトへ反映します。
#
#   物件情報の入力は microCMS に移行しました。日々の反映は
#   sync-cms.yml が行います。こちらは自動実行しません。
#
#   microCMS が使えない事情が起きたときに、Actionsタブから手動で
#   実行すればスプレッドシート運用に戻せる、という位置づけです。
#   移行が完了して不要と判断できたら、このファイルは削除してください。
#
#   ※ 両方を自動実行すると、data/properties.csv を奪い合って
#     内容が行き来してしまうため、schedule と push は外してあります。
#
#   ・変更があれば data/properties.csv と data/properties.js を更新して
#     コミットします
#   ・入力に問題があれば何も変更せず、このワークフローが失敗として残ります
#     （Actions のログにどの行の何が悪いか日本語で出ます）
#
# 使うための準備:
#   1. tools/sheet-url.txt にスプレッドシートのURLを書く
#   2. スプレッドシートの共有を「リンクを知っている全員」→「閲覧者」にする
#   3. GitHub の Settings → Actions → General →
#      Workflow permissions を「Read and write permissions」にする
#
# =====================================================
name: 【予備】スプレッドシートを反映

on:
  workflow_dispatch: # 手動実行のみ

concurrency:
  # sync-cms.yml と同じ名前にして、同時に走らないようにする
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 写真だけを反映（写真のアップロードで動いたとき）
        if: github.event_name == 'push'
        # スプレッドシートは見に行かない。写真を上げただけなのに
        # シート側の一時的な不調で失敗する、という事故を防ぐため。
        run: node tools/csv-to-properties.js

      - name: スプレッドシートと写真を取り込んで反映
        if: github.event_name != 'push'
        env:
          # 写真をGoogleドライブから取り込む場合に設定します。
          # 未設定でもスプレッドシートの反映は動きます（写真は images/properties/ のまま）。
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node tools/fetch-sheet.js

      - name: 変更があればコミットする
        run: |
          # 物件を追加すると sitemap.xml も変わり、大きい写真は自動縮小されるため、
          # 生成・更新されうるものをまとめて対象にする
          TARGETS="data/ sitemap.xml robots.txt images/properties/"
          if git diff --quiet -- $TARGETS; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TARGETS
          if [ "${{ github.event_name }}" = "push" ]; then
            MSG="物件写真を反映（自動）"
          else
            MSG="物件情報を更新（スプレッドシートから自動反映）"
          fi
          git commit -m "$MSG"
          git push
          echo "反映した内容:"
          git show --stat --oneline HEAD

      - name: 取り残した変更がないか確認する
        run: |
          # 生成物のコミット漏れがあると、次のテストで「最新ではない」と落ちるため
          if ! git diff --quiet; then
            echo "::error::コミットされていない変更が残っています。"
            git status --short
            exit 1
          fi
