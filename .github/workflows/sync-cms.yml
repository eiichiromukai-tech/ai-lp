# =====================================================
# microCMS の内容を自動でサイトへ反映します。
#
#   ・15分おきにmicroCMSを見に行き、変更があれば反映します
#     （管理画面で「公開」を押してから、最大15分でサイトに出ます）
#   ・急ぐときは Actions タブの「Run workflow」ですぐ反映できます
#   ・入力に問題があれば何も変更せず、このワークフローが失敗として残ります
#     （Actions のログにどの物件の何が悪いか日本語で出ます）
#
# 使うための準備:
#   1. tools/cms-config.json に serviceDomain を書く
#   2. Settings → Secrets and variables → Actions に
#      MICROCMS_API_KEY（GET権限のあるAPIキー）を登録する
#   3. Settings → Actions → General → Workflow permissions を
#      「Read and write permissions」にする
#   手順の全体は docs/microcms-setup.md に書いてあります。
#
# 「公開」と同時に反映したい場合について:
#   microCMS の Webhook は X- で始まるヘッダーしか送れず、GitHub が求める
#   Authorization ヘッダーを付けられないため、直接呼び出すことはできません。
#   中継役を別に用意すれば可能ですが、部品が増えて壊れる箇所も増えるため、
#   ここでは短い間隔で見に行く方式にしています。
# =====================================================
name: 物件情報を反映（microCMS）

on:
  schedule:
    # 15分おき。GitHubの都合で多少遅れることがあります
    - cron: '*/15 * * * *'
  workflow_dispatch: # 急ぎのときはActionsタブから手動で実行できます
  repository_dispatch:
    # 将来、中継役を用意して即時反映にする場合の入口（いまは使っていません）
    types: [cms-update]

concurrency:
  group: sync-content
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: microCMS から取り込んで反映
        env:
          MICROCMS_API_KEY: ${{ secrets.MICROCMS_API_KEY }}
        run: node tools/fetch-cms.js

      - name: 変更があればコミットする
        run: |
          # 物件を追加すると sitemap.xml も変わり、大きい写真は自動縮小されるため、
          # 生成・更新されうるものをまとめて対象にする
          TARGETS="data/ sitemap.xml robots.txt images/properties/"
          if git diff --quiet -- $TARGETS; then
            echo "変更はありませんでした。"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $TARGETS
          git commit -m "物件情報を更新（microCMSから自動反映）"
          git push
          echo "反映した内容:"
          git show --stat --oneline HEAD

      - name: 取り残した変更がないか確認する
        run: |
          # 生成物のコミット漏れがあると、次のテストで「最新ではない」と落ちるため
          if ! git diff --quiet; then
            echo "::error::コミットされていない変更が残っています。"
            git status --short
            exit 1
          fi
